services:
  - type: web
    name: schulorganizer
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: schulorganizer-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: DATABASE_PATH
        value: /var/data/schulorganizer.sqlite
